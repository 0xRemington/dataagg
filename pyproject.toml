[project]
name = "marketagg"
version = "0.1.0"
description = "Private, restart-safe options and underlying market-data aggregator (research use)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "cryptography>=44",
    "duckdb>=1.1",
    "exchange-calendars>=4.6",
    "fastapi>=0.115",
    "httpx>=0.28",
    "plotly>=5.24",
    "psycopg[binary]>=3.2",
    "pyarrow>=18",
    "pydantic>=2.9,<3",
    "pyyaml>=6",
    "sqlalchemy>=2.0",
    "streamlit>=1.40",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.16.0",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20260906",
]
yahoo = [
    "yfinance==1.7.0",
]

[project.scripts]
marketagg = "marketagg.cli:main"

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DTZ", "RUF", "PL", "SIM"]
ignore = ["PLR0913", "PLR0917", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR0915"]
"scripts/**" = ["S", "PLC0415", "PLR0912", "PLR0915"]
"migrations/versions/*" = ["E501"]  # verbatim reference DDL
# f-strings interpolate only module-constant predicates (mutation-test seams); values are bound.
"src/marketagg/analytics/asof.py" = ["S608"]
# Partition table names are built only from the DATASETS allowlist and a date value.
"src/marketagg/storage/archive.py" = ["S608"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["exchange_calendars.*", "pandas.*", "yfinance.*", "pyarrow.*", "plotly.*", "streamlit.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
markers = [
    "integration: needs disposable PostgreSQL 18 or other local services",
    "acceptance: end-to-end acceptance scenarios",
    "performance: capacity and latency measurements",
    "live: contacts a real provider; opt-in only via --run-live",
]
filterwarnings = ["error"]
