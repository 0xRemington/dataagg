# Alembic configuration. The database URL is never stored here: env.py reads it
# from an injected connection (tests/tools) or from DATABASE_URL_FILE via settings.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
version_table = alembic_version

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
